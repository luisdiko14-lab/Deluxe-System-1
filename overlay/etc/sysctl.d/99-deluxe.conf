# Deluxe System 1 — memory/IO tuning (works together with zram swap)
vm.swappiness = 100            # with compressed RAM swap, swapping early is cheap and keeps the page cache big
vm.page-cluster = 0            # zram has no seek penalty: don't read-ahead swap pages
vm.vfs_cache_pressure = 50
vm.dirty_ratio = 15
vm.dirty_background_ratio = 5
fs.inotify.max_user_watches = 524288   # IDEs / file sync tools
kernel.sysrq = 176
net.core.default_qdisc = fq_codel
net.ipv4.tcp_fastopen = 3
