# Sourced by grub-mkconfig after /etc/default/grub, so these win. Applies to the INSTALLED system.
GRUB_DISTRIBUTOR="Deluxe System 1"
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash"
GRUB_TIMEOUT=3
GRUB_TIMEOUT_STYLE=menu
GRUB_GFXMODE=auto
GRUB_GFXPAYLOAD_LINUX=keep
GRUB_THEME="/usr/share/grub/themes/deluxe/theme.txt"
GRUB_DISABLE_OS_PROBER=false
