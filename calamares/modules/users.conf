---
defaultGroups:
  - adm
  - cdrom
  - sudo
  - dip
  - plugdev
  - lpadmin
  - docker
autologinGroup: autologin
doAutologin: false
sudoersGroup: sudo
setRootPassword: false
doReusePassword: true
passwordRequirements:
  minLength: 4
  maxLength: -1
allowWeakPasswords: true
allowWeakPasswordsDefault: false
userShell: /bin/bash
hostname:
  location: EtcFile
  writeHostsFile: true
