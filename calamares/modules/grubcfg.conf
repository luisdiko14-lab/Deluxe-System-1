# Writes /etc/default/grub for the installed system. Theme and distributor name come from
# /etc/default/grub.d/deluxe.cfg which grub-mkconfig sources afterwards.
---
overwrite: false
keep_distributor: false
prefer_grub_d: false
defaults:
  GRUB_TIMEOUT: 3
  GRUB_DEFAULT: "saved"
  GRUB_DISABLE_SUBMENU: true
  GRUB_SAVEDEFAULT: true
  GRUB_CMDLINE_LINUX_DEFAULT: "quiet splash"
  GRUB_CMDLINE_LINUX: ""
