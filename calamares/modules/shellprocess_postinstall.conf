# Post-install hook: runs inside the new system. Removes live-only packages and the live user.
# (script is /usr/local/lib/deluxe/postinstall.sh from the live image, copied into the target by unpackfs)
---
dontChroot: false
timeout: 600
script:
  - command: "/usr/local/lib/deluxe/postinstall.sh"
    timeout: 600
