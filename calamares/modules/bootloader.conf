# GRUB for both firmware types. Calamares detects UEFI vs BIOS and installs the matching flavour:
#   UEFI -> grub-efi-amd64 + Canonical-signed shim (Secure Boot works), entry "Deluxe System 1"
#   BIOS -> grub-pc into the MBR of the selected disk
---
efiBootLoader: "grub"
kernel: "/vmlinuz"
img: "/initrd.img"
fallback: "/initrd.img.old"
timeout: 3
bootloaderEntryName: "Deluxe System 1"
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
efiBootloaderId: "deluxe"
installEFIFallback: true
