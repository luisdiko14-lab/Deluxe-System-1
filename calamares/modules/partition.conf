# Disk partitioning. The "Encrypt system" checkbox (LUKS full-disk encryption) is enabled here.
---
efiSystemPartition: "/boot/efi"
efiSystemPartitionSize: 512M
efiSystemPartitionName: "EFI"
# Full-disk encryption option shown in the "Erase disk" / "Install alongside" pages
enableLuksAutomatedPartitioning: true
# GRUB 2.12 cannot open LUKS2 volumes that use Argon2id, so use LUKS1-compatible parameters for /boot-less layouts.
luksGenerator: luks1
userSwapChoices: [ none, file ]      # zram already provides swap; a swap FILE is offered for hibernation
initialSwapChoice: none
drawNestedPartitions: false
alwaysShowPartitionLabels: true
allowManualPartitioning: true
initialPartitioningChoice: erase
defaultFileSystemType: "ext4"
availableFileSystemTypes: [ "ext4", "btrfs", "xfs" ]
defaultPartitionTableType: gpt
requiredPartitionTableType: [ gpt, msdos ]
