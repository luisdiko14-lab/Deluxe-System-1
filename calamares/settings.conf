# Calamares main configuration for Deluxe System 1 — installed to /etc/calamares/settings.conf
---
modules-search: [ local ]

# One extra instance of the generic "shellprocess" module: our post-install clean-up.
instances:
  - id: postinstall
    module: shellprocess
    config: shellprocess_postinstall.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition        # includes the "Encrypt system" (LUKS) checkbox
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - luksbootkeyfile  # embeds a keyfile so the LUKS passphrase is asked once, not twice
      - users
      - hwclock
      - shellprocess@postinstall   # removes casper/calamares and the live user
      - initramfscfg
      - initramfs
      - grubcfg
      - bootloader       # GRUB for BIOS (grub-pc) or UEFI (grub-efi + signed shim), chosen automatically
      - umount
  - show:
      - finished

branding: deluxe
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
