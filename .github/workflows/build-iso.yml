name: Build Deluxe System 1 ISO

on:
  workflow_dispatch:
    inputs:
      quick:
        description: Use faster zstd compression (larger ISO; testing only)
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "build.sh"
      - "config.env"
      - "packages/**"
      - "hooks/**"
      - "overlay/**"
      - "calamares/**"
      - "iso/**"
      - "tools/**"
      - ".github/workflows/build-iso.yml"

permissions:
  contents: read

concurrency:
  group: deluxe-iso-self-hosted-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Deluxe System 1 ISO (self-hosted)
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 360

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check runner requirements
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(uname -m)" != "x86_64" ]]; then
            echo "::error::This project builds amd64 ISOs; the runner must be x86_64."
            exit 1
          fi
          if [[ ! -r /etc/os-release ]] || ! grep -q '^VERSION_ID="24.04"$' /etc/os-release; then
            echo "::error::Use an Ubuntu 24.04 runner for a supported build."
            cat /etc/os-release || true
            exit 1
          fi
          if ! sudo -n true 2>/dev/null; then
            echo "::error::The runner service user needs passwordless sudo because build.sh installs host packages and uses mount/chroot."
            exit 1
          fi
          available_gb="$(df --output=avail -BG "$GITHUB_WORKSPACE" | tail -1 | tr -dc '0-9')"
          echo "Available disk space: ${available_gb} GB"
          if (( available_gb < 16 )); then
            echo "::error::At least 16 GB of free disk space is required; found ${available_gb} GB."
            exit 1
          fi

      - name: Build release ISO (XZ)
        if: ${{ !inputs.quick }}
        run: sudo -E ./build.sh

      - name: Build quick test ISO (Zstandard)
        if: ${{ inputs.quick }}
        run: sudo -E ./build.sh --quick

      - name: Verify ISO and checksum
        shell: bash
        run: |
          set -euo pipefail
          cd out
          sha_file="$(find . -maxdepth 1 -name '*.iso.sha256' -print -quit)"
          if [[ -z "$sha_file" ]]; then
            echo "::error::No ISO checksum file was generated."
            exit 1
          fi
          sha256sum --check "$sha_file"
          ls -lh

      - name: Upload ISO, checksum, and package manifest
        uses: actions/upload-artifact@v4
        with:
          name: deluxe-system-1-iso-${{ github.run_number }}
          path: |
            out/*.iso
            out/*.iso.sha256
            out/*.manifest
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
